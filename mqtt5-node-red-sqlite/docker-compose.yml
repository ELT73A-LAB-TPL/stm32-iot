
name: STM32-IoT

services:
  mqtt5:
    image: eclipse-mosquitto:latest
    container_name: mqtt5
    ports:
      - "1883:1883"  # MQTT port
      - "9001:9001"  # WebSocket port
    volumes:
      - mqtt-config:/mosquitto/config:rw
      - mqtt-data:/mosquitto/data:rw
      - mqtt-log:/mosquitto/log:rw
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf  # Custom config
    networks:
      - iot-network
    restart: unless-stopped
    # config for host.docker.internal

  node-red:
    # image: nodered/node-red:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: node-red
    environment:
      - TZ=America/Sao_Paulo
    ports:
      - "1881:1880"  # Node-RED UI, left 1880 for CubeMonitor
    volumes:
      - node-red-data:/data
    depends_on:
      - mqtt5
    networks:
      - iot-network
    restart: unless-stopped

volumes:
  mqtt-config:
  mqtt-data:
  mqtt-log:
  node-red-data:

networks:
  iot-network:
    driver: bridge