# mosquitto/config/mosquitto.conf
# Broker MQTT para o sistema de detecção de quedas

# ─── Listener MQTT padrão ───────────────────────────────
listener 1883
protocol mqtt

# ─── Listener WebSocket (debug via browser) ─────────────
listener 9001
protocol websockets

# ─── Autenticação ────────────────────────────────────────
# Para produção: descomentar e criar arquivo com
# mosquitto_passwd -c /mosquitto/config/passwd smartband
# password_file /mosquitto/config/passwd
# allow_anonymous false

# Desenvolvimento: acesso anônimo permitido
allow_anonymous true

# ─── Persistência ────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ─── Log ─────────────────────────────────────────────────
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# ─── Tópicos utilizados pelo sistema ─────────────────────
# smartband/eventos      → quedas e geofencing (smartband publica)
# smartband/status       → heartbeat de conexão (smartband publica)
# smartband/confirmacao  → confirmação do cuidador (app Flutter publica)
